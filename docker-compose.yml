services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/topic-signals
    environment:
      - APP_ENV=local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHART_OUTPUT_DIR=/var/www/topic-signals/var/charts
      - REPORT_OUTPUT_DIR=/var/www/topic-signals/var/reports
      - CHART_PYTHON_BIN=/opt/chart-venv/bin/python
      - CHART_SCRIPT_PATH=/var/www/topic-signals/docker/chart/render.py
    depends_on:
      - redis
    networks:
      - topic-signals

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/topic-signals/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - topic-signals

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis-data:/data
    networks:
      - topic-signals

networks:
  topic-signals:
    driver: bridge

volumes:
  redis-data:
